TIMEOUT=5

# Larger boot menu + kernel FB (QEMU window follows this; match Makefile VIRTIO_GPU_X/Y).
# Requires virtio-vga in QEMU (not virtio-gpu-pci alone) so Limine has a VGA boot FB.
INTERFACE_RESOLUTION=1920x1080

# Limine draws its menu with an 8x16 font and only scales it automatically from
# 2560x1440 upwards, so at 1920x1080 the boot menu is a few tiny lines in a
# black canvas.  term_font_scale must be an "WxH" pair (anything else is
# ignored), so 2x2 doubles the menu text on high-DPI/native resolutions.
# term_margin keeps the text off the screen edges.
TERM_FONT_SCALE=2x2
TERM_MARGIN=32

:inDevOS
    PROTOCOL=limine
    KERNEL_PATH=boot:///boot/boot.bin
    TERMINAL=yes
    FRAMEBUFFER=yes
    RESOLUTION=1920x1080x32
